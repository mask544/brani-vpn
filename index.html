<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Брани VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#04161a;--bg2:#0b3a3a;--mint:#4dffc3;--mint2:#1fd6a0;--card:rgba(255,255,255,.06);--line:rgba(120,255,210,.25);--txt:#eafff7;--mut:#9cc9bd}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Manrope,system-ui,sans-serif;color:var(--txt);min-height:100vh;
    background:radial-gradient(120% 60% at 100% 0%,#0f6b5a 0%,transparent 60%),
               radial-gradient(90% 50% at 0% 100%,#0b3f63 0%,transparent 60%),
               linear-gradient(180deg,var(--bg1),var(--bg2));}
  .wrap{max-width:460px;margin:0 auto;padding:22px 20px 190px}
  h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.6px}
  h1 span{color:var(--mint)}
  .sub{margin-top:10px;font-weight:700;font-size:14px;color:var(--txt)}
  .logo{margin:22px auto 8px;width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:#0a2a2c;border:5px solid var(--mint);box-shadow:0 0 36px rgba(77,255,195,.45),inset 0 0 26px rgba(77,255,195,.15);
    font-family:Unbounded,sans-serif;font-weight:700;font-size:60px;color:#fff}
  /* карточка в форме папки: вкладка с названием слева, плашка справа */
  .card{--cbg:#0c302d;position:relative;margin-top:44px;padding:18px 20px 18px;border-radius:0 24px 24px 24px;background:var(--cbg);
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:filter .2s,background .2s}
  .card .tab{position:absolute;left:0;bottom:calc(100% - 2px);height:32px;padding:7px 52px 0 20px;background:var(--cbg);border-radius:20px 0 0 0;
    clip-path:polygon(0 0,calc(100% - 40px) 0,100% 100%,0 100%);font-weight:700;font-size:15px;color:var(--mut);transition:background .2s}
  .card.on{--cbg:#0f4d43;filter:drop-shadow(0 0 1.2px var(--mint)) drop-shadow(0 0 14px rgba(77,255,195,.35))}
  .card.on .tab{color:var(--txt)}
  .price{font-family:Unbounded,sans-serif;font-weight:700;font-size:23px;white-space:nowrap}
  .price s{font-size:16px;color:var(--mut);margin-right:8px;font-weight:500}
  .pm{text-align:right;font-family:Unbounded,sans-serif;font-weight:700;font-size:20px;line-height:1.12}
  .badge{position:absolute;bottom:calc(100% - 6px);right:0;padding:6px 16px 10px;border-radius:16px 16px 0 0;font-size:12.5px;font-weight:700;
    background:#d9fff0;color:#06302a}
  .card:first-child .badge{background:var(--mint)}
  .bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 18px 22px;background:linear-gradient(180deg,rgba(6,34,36,0) 0,rgba(6,34,36,.98) 16px)}
  .bottom .in{max-width:460px;margin:0 auto}
  .note{text-align:center;font-size:13px;color:var(--mut);margin-bottom:10px}
  .note b{color:var(--mint)}
  button{width:100%;border:0;border-radius:18px;padding:18px;font-family:Unbounded,sans-serif;font-weight:700;font-size:18px;
    color:#04261f;background:linear-gradient(90deg,var(--mint),var(--mint2));cursor:pointer}
  .foot{margin-top:10px;text-align:center;font-size:12.5px;color:var(--mut);line-height:1.5}
</style>
</head>
<body>
<div id="splash"><div class="sl">Б</div><div class="spin"></div></div>
<style>
  html{background:#020a0b}
  #splash{position:fixed;inset:0;z-index:99;background:#020a0b;display:flex;align-items:center;justify-content:center;transition:opacity .45s}
  #splash::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .7s;
    background:radial-gradient(55% 40% at 0% 66%,#19f0a8 0%,transparent 62%),
               radial-gradient(70% 45% at 100% 100%,#0f9a74 0%,transparent 62%),
               radial-gradient(85% 55% at 45% 62%,#075443 0%,transparent 72%)}
  #splash.p2::before{opacity:1}
  #splash .sl{position:relative;font-family:Unbounded,Bahnschrift,Arial,sans-serif;font-weight:700;font-size:150px;color:#0b2a25;transition:opacity .35s}
  #splash.p2 .sl{opacity:0}
  #splash .spin{position:absolute;width:46px;height:46px;border-radius:50%;border:3px solid rgba(77,255,195,.22);border-top-color:#4dffc3;
    animation:bspin .8s linear infinite;opacity:0;transition:opacity .35s}
  #splash.p2 .spin{opacity:1}
  #splash.done{opacity:0;pointer-events:none}
  @keyframes bspin{to{transform:rotate(360deg)}}
</style>
<script>
(function(){
  var s=document.getElementById('splash'),t0=Date.now();
  var tg=window.Telegram&&Telegram.WebApp;
  if(tg){try{tg.setBackgroundColor('#020a0b');tg.setHeaderColor('#020a0b');}catch(e){}}
  setTimeout(function(){s.classList.add('p2')},450);
  var fired=false;function fin(){if(fired)return;fired=true;setTimeout(function(){document.body.classList.add('ready');s.classList.add('done');setTimeout(function(){s.remove()},500)},Math.max(0,1400-(Date.now()-t0)))}
  window.addEventListener('load',function(){(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fin)});
  setTimeout(fin,4000);
})();
</script>
<style>
  /* анимация появления после заставки: текст и тарифы → логотип с 3D-поворотом → кнопка снизу */
  .a1,.a2,.a3{opacity:0}
  body.ready .a1{animation:fadeUp .38s ease-out both}
  body.ready .a2{animation:logoIn .65s cubic-bezier(.2,.8,.2,1) .12s both,logoFloat 6s ease-in-out .8s infinite}
  body.ready .a3{animation:fadeUp .42s ease-out .5s both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes logoIn{from{opacity:0;transform:perspective(600px) rotateY(-40deg) scale(.78)}
                    to{opacity:1;transform:perspective(600px) rotateY(0) scale(1)}}
  @keyframes logoFloat{0%,100%{transform:perspective(600px) rotateY(0) rotateX(0)}
                       25%{transform:perspective(600px) rotateY(14deg) rotateX(5deg)}
                       75%{transform:perspective(600px) rotateY(-14deg) rotateX(-4deg)}}
</style>
<div class="wrap">
  <h1 class="a1"><span>Брани VPN</span> — включил и забыл.</h1>
  <div class="sub a1">Любой тариф = 2 устройства.</div>
  <div class="logo a2">Б</div>
  <div id="cards" class="a1"></div>
</div>
<style>
  .cta{border-radius:24px;background:rgba(6,40,38,.92);border:1.5px solid var(--line);overflow:hidden}
  .cta .note{margin:0;padding:11px 0 10px;font-size:13.5px;color:var(--txt);display:flex;gap:7px;justify-content:center;align-items:center}
  .cta .note i{width:18px;height:18px;border-radius:50%;background:var(--mint);color:#04261f;font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .cta button{border-radius:20px;margin:0}
  .foot#foot{margin-top:6px;font-size:10.5px;line-height:1.25;color:var(--txt);opacity:.4;letter-spacing:.1px}
  .bottom{padding:10px 20px 5px}
  .cta button{padding:16px}
  /* окно оплаты */
  .sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
    border-radius:28px 28px 0 0;padding:10px 22px 28px;
    background:radial-gradient(90% 70% at 0% 100%,#0e6b56 0%,transparent 70%),radial-gradient(80% 60% at 100% 0%,#0b4a44 0%,transparent 70%),#05211f}
  .sheet.on{transform:none}
  .sheet .in{max-width:460px;margin:0 auto}
  .grab{width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin:0 auto 18px}
  .sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .sh-top b{font-family:Unbounded;font-size:17px;letter-spacing:.3px}
  .pill{padding:7px 14px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-weight:700;font-size:13px}
  .pay-ru{width:100%;border:0;border-radius:20px;background:#fff;padding:16px 10px 14px;cursor:pointer;display:block}
  .logos{display:flex;align-items:center;justify-content:center;gap:14px;height:28px}
  .l-visa{font:italic 900 24px/1 Arial,sans-serif;color:#1a1f71;letter-spacing:-.5px}
  .l-mc{position:relative;width:38px;height:24px}
  .l-mc:before,.l-mc:after{content:"";position:absolute;top:0;width:24px;height:24px;border-radius:50%}
  .l-mc:before{left:0;background:#eb001b}.l-mc:after{right:0;background:#f79e1b;mix-blend-mode:multiply}
  .l-mir{font:900 24px/1 Arial,sans-serif;color:#0f754e;letter-spacing:.5px}
  .l-sbp{display:flex;align-items:center;gap:4px;font:700 13px/1 Arial,sans-serif;color:#1d1346}
  .l-sbp span{width:0;height:0;border-left:12px solid #5b57a2;border-top:8px solid transparent;border-bottom:8px solid transparent}
  .pay-ru .t{margin-top:8px;font-family:Unbounded;font-weight:700;font-size:17px;color:#06302a}
  .pay-fx{width:100%;margin-top:14px;border:1.5px solid var(--line);border-radius:20px;background:rgba(0,0,0,.35);color:var(--txt);
    padding:20px 10px;font-family:Manrope;font-weight:700;font-size:16px;cursor:pointer}
  .legal{margin-top:20px;text-align:center;font-size:13px;line-height:1.6;color:var(--txt);opacity:.85}
  .legal a{color:inherit}
  .cancel{margin-top:12px;text-align:center;font-size:13px;color:var(--mut)}
</style>
<div class="bottom a3"><div class="in">
  <div class="cta">
    <div class="note"><i>✓</i>Можно отменить в любое время</div>
    <button id="go">Подключить</button>
  </div>
  <div class="foot" id="foot"></div>
</div></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="in">
  <div class="grab"></div>
  <div class="sh-top"><b>БРАНИ VPN</b><span class="pill">RUB</span></div>
  <button class="pay-ru" id="payRu">
    <div class="logos">
      <img src="visa.svg" alt="Visa" style="height:17px">
      <img src="mastercard.svg" alt="Mastercard" style="height:26px">
      <img src="mir.svg" alt="Мир" style="height:19px">
      <img src="sbp.svg" alt="СБП" style="height:28px">
    </div>
    <div class="t" id="payRuT">Оплатить</div>
  </button>
  <button class="pay-fx" id="payFx">Оплатить зарубежной валютой</button>
  <div class="legal">Оплачивая подписку, вы соглашаетесь с
    <a href="docs.html#offer">офертой</a>, <a href="docs.html#privacy">политикой конфиденциальности</a>
    и <a href="docs.html#rules">правилами пользования</a>.</div>
  <div class="cancel">Отменить подписку можно в любой момент</div>
</div></div>
<script>
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#04161a'); }
  const q = new URLSearchParams(location.search);
  const trial = q.get('trial') !== '0';
  const TRIAL_DAYS = +(q.get('days') || 3), TRIAL_PRICE = +(q.get('tp') || 10);
  const T = [
    {k:'12m', m:12, p:1990, old:2989, label:'12 месяцев'},
    {k:'6m',  m:6,  p:1190, old:1494, label:'6 месяцев', hit:'Выбор большинства'},
    {k:'1m',  m:1,  p:249,  old:null, label:'1 месяц'},
  ];
  let sel = q.get('tariff') || '6m';
  const rub = n => n.toLocaleString('ru-RU') + ' ₽';
  function draw(){
    document.getElementById('cards').innerHTML = T.map(t => `
      <div class="card ${t.k===sel?'on':''}" data-k="${t.k}">
        <div class="tab">${t.label}</div>
        ${t.k==='12m' ? '<div class="badge">Выгоднее всего</div>' : t.hit ? `<div class="badge">${t.hit}</div>` : ''}
        <div class="price">${t.old?`<s>${rub(t.old)}</s>`:''}${rub(t.p)}</div>
        <div class="pm">${Math.floor(t.p/t.m)}₽/<br>месяц</div>
      </div>`).join('');
    document.querySelectorAll('.card').forEach(c => c.onclick = () => {
      sel = c.dataset.k; tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); draw();
    });
    const t = T.find(x => x.k === sel);
    document.getElementById('go').textContent = trial ? `Подключить за ${TRIAL_PRICE} ₽` : `Оплатить ${rub(t.p)}`;
    const word = TRIAL_DAYS % 10 === 1 && TRIAL_DAYS !== 11 ? 'день' : TRIAL_DAYS < 5 ? 'дня' : 'дней';
    document.getElementById('foot').textContent = trial
      ? `Через ${TRIAL_DAYS} ${word} — ${rub(t.p)} за ${t.label}`
      : `${t.label} — ${rub(t.p)}`;
    document.getElementById('payRuT').textContent = `Оплатить ${trial ? TRIAL_PRICE + ' ₽' : rub(t.p)}`;
  }
  const sheet = document.getElementById('sheet'), bg = document.getElementById('sheetBg');
  const openSheet = on => { sheet.classList.toggle('on', on); bg.classList.toggle('on', on);
    if (tg && tg.BackButton) on ? tg.BackButton.show() : tg.BackButton.hide(); };
  if (tg && tg.BackButton) tg.BackButton.onClick(() => openSheet(false));
  bg.onclick = () => openSheet(false);
  document.getElementById('go').onclick = () => {
    tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); openSheet(true);
  };
  const pay = mode => {
    const bot = q.get('bot') || 'brani_vpn_bot';
    const link = `https://t.me/${bot}?start=${mode}_${sel}`;
    if (tg && tg.initData) { tg.openTelegramLink(link); tg.close(); }
    else { location.href = link; }
  };
  document.getElementById('payRu').onclick = () => pay('pay');      // карты РФ / СБП (ЮKassa)
  document.getElementById('payFx').onclick = () => pay('payfx');    // зарубежные карты (Telegram Stars)
  draw();
</script>
</body>
</html>
